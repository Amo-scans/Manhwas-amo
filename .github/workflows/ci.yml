name: CI

# VÃƒÂ©rifie chaque poussÃƒÂ©e / pull request : types, puis build statique GitHub Pages.
# Aucun secret n'est nÃƒÂ©cessaire : seules des valeurs publiques (URL Supabase +
# clÃƒÂ© anon/publishable, dÃƒÂ©jÃƒÂ  embarquÃƒÂ©e dans le bundle client) sont utilisÃƒÂ©es.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Build de contrÃƒÂ´le servi ÃƒÂ  la racine : la CI ne dÃƒÂ©ploie rien.
      VITE_BASE_PATH: "/"
      VITE_SITE_URL: "https://assia123y.github.io/amo-scans-fr"
      # Valeurs publiques (identiques ÃƒÂ  .env.production), dupliquÃƒÂ©es ici pour que
      # la CI reste verte mÃƒÂªme si .env.production venait ÃƒÂ  manquer.
      VITE_SUPABASE_URL: "https://zfypjnylpbtijjhlcyhr.supabase.co"
      VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_dUwNG2AW7Hl9Vs2l8G3vtw_ql0Q8MZi"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site (GitHub Pages)
        run: npm run build:pages

      - name: Verify build output
        run: |
          test -f dist/client/index.html
          test -f dist/client/404.html
          test -f dist/client/.nojekyll
          test -f dist/client/sitemap.xml
          test -f dist/client/robots.txt
          test -f dist/client/favicon.svg
          test -f dist/client/site.webmanifest
          test -f dist/client/og-image.jpg
          echo "dist/client:"
          ls -la dist/client
          du -sh dist/client
